<div id="routine-e17-states" aria-label="Comparatif des trois stratégies pour les états du panneau tenue">
  <style>
    #routine-e17-states {
      color-scheme: light dark;
      color: light-dark(#24333d, #f3f5f2);
      font-family: ui-rounded, "Nunito Sans", system-ui, sans-serif;
      width: 100%;
    }
    #routine-e17-states[data-dark="true"] { color-scheme: dark; }
    #routine-e17-states[data-dark="false"] { color-scheme: light; }
    #routine-e17-states * { box-sizing: border-box; }
    #routine-e17-states .e17-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: light-dark(#566670, #c0c9c9);
    }
    #routine-e17-states .e17-state-label { font-weight: 500; }
    #routine-e17-states .e17-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }
    #routine-e17-states[data-format="mobile"] .e17-options,
    #routine-e17-states[data-format="tablet"] .e17-options { grid-template-columns: 1fr; }
    #routine-e17-states[data-format="mobile"][data-capture="compare"] .e17-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    #routine-e17-states .e17-option-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    #routine-e17-states .e17-option-heading strong { font-weight: 500; }
    #routine-e17-states .e17-recommended {
      background: light-dark(#d8f0e6, #244c41);
      color: light-dark(#236c57, #bfe6d6);
      border-radius: 999px;
      padding: 4px 8px;
    }
    #routine-e17-states .e17-stage {
      position: relative;
      min-height: 570px;
      overflow: hidden;
      border-radius: 24px;
      background: light-dark(#f5f1e9, #151b23);
      border: 1px solid light-dark(#ddd9d0, #34404d);
      isolation: isolate;
    }
    #routine-e17-states[data-format="mobile"] .e17-stage { min-height: 660px; }
    #routine-e17-states .e17-backdrop-page {
      position: absolute;
      inset: 0;
      padding: 18px;
      opacity: 0.34;
    }
    #routine-e17-states .e17-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    #routine-e17-states .e17-brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: light-dark(#b9e1d4, #315d51);
      font-weight: 500;
    }
    #routine-e17-states .e17-theme-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid light-dark(#d7d4cc, #465261);
      background: light-dark(#fffefd, #202a36);
    }
    #routine-e17-states .e17-weather-strip {
      height: 104px;
      border-radius: 22px;
      background: light-dark(#ccebf4, #284856);
      margin-bottom: 16px;
    }
    #routine-e17-states .e17-routine-card {
      width: 72%;
      height: 225px;
      border-radius: 22px;
      background: light-dark(#fffefd, #202a36);
    }
    #routine-e17-states .e17-veil {
      position: absolute;
      inset: 0;
      background: light-dark(rgba(25, 36, 43, 0.38), rgba(3, 8, 13, 0.58));
      z-index: 1;
    }
    #routine-e17-states .e17-panel {
      position: absolute;
      z-index: 2;
      inset: 0 0 0 auto;
      width: min(88%, 390px);
      display: flex;
      flex-direction: column;
      background: light-dark(#fffefd, #202a36);
      box-shadow: -12px 0 30px light-dark(rgba(44, 48, 50, 0.14), rgba(0, 0, 0, 0.28));
    }
    #routine-e17-states[data-format="mobile"] .e17-panel {
      inset: auto 0 0 0;
      width: 100%;
      height: 90%;
      border-radius: 24px 24px 0 0;
    }
    #routine-e17-states .e17-panel-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid light-dark(#e5e1da, #374351);
    }
    #routine-e17-states .e17-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #routine-e17-states .e17-head-row strong { font-weight: 500; }
    #routine-e17-states .e17-close {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid light-dark(#d7d4cc, #465261);
      background: light-dark(#fffefd, #202a36);
      color: inherit;
    }
    #routine-e17-states .e17-subtitle {
      color: light-dark(#65747b, #b7c1c3);
      margin: 4px 0 0;
    }
    #routine-e17-states .e17-body {
      flex: 1;
      min-height: 0;
      padding: 18px;
      overflow: hidden;
    }
    #routine-e17-states .e17-state-card {
      min-height: 310px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 22px;
      background: light-dark(#eef8fb, #253943);
      padding: 22px;
    }
    #routine-e17-states .e17-state-title {
      font-weight: 500;
      margin: 14px 0 4px;
    }
    #routine-e17-states .e17-state-copy {
      color: light-dark(#65747b, #c2cbcc);
      margin: 0;
      max-width: 28ch;
    }
    #routine-e17-states .e17-settings {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid light-dark(#78afc0, #6594a3);
      color: light-dark(#315f6f, #cbe9f2);
      background: transparent;
      font-weight: 500;
    }
    #routine-e17-states .e17-weather-art {
      position: relative;
      width: 92px;
      height: 72px;
      flex: 0 0 auto;
    }
    #routine-e17-states .e17-sun {
      position: absolute;
      width: 48px;
      height: 48px;
      left: 4px;
      top: 0;
      border-radius: 50%;
      background: light-dark(#ffd36d, #e5ac48);
      box-shadow: 0 7px 0 light-dark(#efa35f, #aa683f);
    }
    #routine-e17-states .e17-cloud {
      position: absolute;
      width: 68px;
      height: 31px;
      right: 0;
      bottom: 12px;
      border-radius: 22px;
      background: light-dark(#f7fbff, #9db7c2);
      box-shadow: -15px -11px 0 1px light-dark(#e7f4fb, #718f9c);
    }
    #routine-e17-states .e17-rain {
      position: absolute;
      width: 7px;
      height: 16px;
      border-radius: 6px;
      bottom: 0;
      background: light-dark(#6fb8db, #6ac3eb);
      transform: rotate(18deg);
    }
    #routine-e17-states .e17-rain-one { right: 14px; }
    #routine-e17-states .e17-rain-two { right: 36px; }
    #routine-e17-states .e17-offline {
      position: absolute;
      right: -2px;
      top: -2px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: light-dark(#8a6255, #ffd5c8);
      background: light-dark(#ffe7df, #653e35);
    }
    #routine-e17-states .e17-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    #routine-e17-states .e17-tile {
      min-height: 112px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 18px;
      border: 1px solid light-dark(#d8ddd7, #465261);
      color: inherit;
      background: light-dark(#fffefd, #202a36);
    }
    #routine-e17-states .e17-tile[data-selected="true"] {
      border-color: light-dark(#74bca5, #76c9ac);
      background: light-dark(#e4f5ef, #29443c);
    }
    #routine-e17-states .e17-tile img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    #routine-e17-states .e17-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid light-dark(#a9b3ae, #73808b);
    }
    #routine-e17-states .e17-tile[data-selected="true"] .e17-check {
      color: light-dark(#133c31, #10382d);
      background: light-dark(#9fd8c6, #8ed5bc);
      border-color: transparent;
    }
    #routine-e17-states .e17-alert {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: light-dark(#8f4d3d, #ffc0b0);
    }
    #routine-e17-states .e17-manual-note {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: light-dark(#52636c, #c4ced0);
    }
    #routine-e17-states .e17-footer {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-top: 1px solid light-dark(#e5e1da, #374351);
      background: light-dark(#fffefd, #202a36);
    }
    #routine-e17-states .e17-secondary,
    #routine-e17-states .e17-primary {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 14px;
      padding: 0 14px;
      font-weight: 500;
    }
    #routine-e17-states .e17-secondary {
      border: 1px solid light-dark(#d2d5cf, #53606c);
      background: transparent;
      color: inherit;
    }
    #routine-e17-states .e17-primary {
      flex: 1;
      border: 1px solid transparent;
      color: light-dark(#12372e, #0f3028);
      background: light-dark(#9fd8c6, #8ed5bc);
    }
    #routine-e17-states .e17-primary:disabled {
      color: light-dark(#8a9590, #8d9995);
      background: light-dark(#e5e8e4, #39443f);
    }
    #routine-e17-states .e17-solo { width: 100%; }
    @media (max-width: 820px) {
      #routine-e17-states .e17-options { grid-template-columns: 1fr; }
      #routine-e17-states .e17-stage { min-height: 650px; }
      #routine-e17-states .e17-panel { inset: auto 0 0 0; width: 100%; height: 90%; border-radius: 24px 24px 0 0; }
    }
  </style>
  <div class="e17-topline">
    <span>État comparé</span>
    <span class="e17-state-label" aria-live="polite">Météo indisponible</span>
  </div>
  <div class="e17-options"></div>

      ];
      const weatherArt = (offline = false) => `<div class="e17-weather-art" aria-label="Temps nuageux avec pluie"><span class="e17-sun"></span><span class="e17-cloud"></span><span class="e17-rain e17-rain-one"></span><span class="e17-rain e17-rain-two"></span>${offline ? '<span class="e17-offline"><i data-lucide="wifi-off" aria-hidden="true"></i></span>' : ''}</div>`;
      const grid = (selected, manual = false) => `<div class="e17-grid">${clothes.map(([id, label, src]) => `<button type="button" class="e17-tile" data-selected="${selected}" aria-pressed="${selected}" aria-label="${label}${manual ? ', choix manuel' : ''}"><span class="e17-check">${selected ? '<i data-lucide="check" aria-hidden="true"></i>' : ''}</span><img src="${src}" alt=""><span>${label}</span></button>`).join('')}</div>`;
      const stateCard = (kind, actionInside) => {
        const loading = kind === 'loading';
        return `<div class="e17-state-card" ${loading ? 'role="status"' : ''}>${weatherArt(!loading)}<div class="e17-state-title">${loading ? 'Météo en cours…' : 'Météo indisponible'}</div>${loading ? '' : '<p class="e17-state-copy">Regardons le ciel.</p>'}${actionInside && !loading ? '<button type="button" class="e17-settings"><i data-lucide="settings" aria-hidden="true"></i>Réglages météo</button>' : ''}</div>`;
      };
      const commonHead = `<div class="e17-panel-head"><div class="e17-head-row"><strong>Préparer la tenue</strong><button type="button" class="e17-close" aria-label="Fermer"><i data-lucide="x" aria-hidden="true"></i></button></div><p class="e17-subtitle">Une proposition simple à ajuster.</p></div>`;
      const normalFooter = (disabled = false) => `<div class="e17-footer"><button type="button" class="e17-secondary"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Réinitialiser</button><button type="button" class="e17-primary" ${disabled ? 'disabled' : ''}><i data-lucide="check" aria-hidden="true"></i>Tenue prête</button></div>`;
      function proposalBody(id) {
        const state = model.state;
        if (state === 'loading') {
          if (id === 'Q2') return `${commonHead}<div class="e17-body">${stateCard('loading', false)}</div><div class="e17-footer"><button type="button" class="e17-primary e17-solo" disabled>Météo en cours…</button></div>`;
          return `${commonHead}<div class="e17-body">${stateCard('loading', false)}</div>`;
        }
        if (state === 'unavailable') {
          if (id === 'Q1') return `${commonHead}<div class="e17-body">${stateCard('unavailable', true)}</div>`;
          if (id === 'Q2') return `${commonHead}<div class="e17-body">${stateCard('unavailable', false)}</div><div class="e17-footer"><button type="button" class="e17-primary e17-solo"><i data-lucide="settings" aria-hidden="true"></i>Ouvrir les réglages</button></div>`;
          return `${commonHead}<div class="e17-body"><div class="e17-manual-note"><i data-lucide="cloud-off" aria-hidden="true"></i><span>Sans météo · choix manuel</span></div>${grid(true, true)}</div>${normalFooter(false)}`;
        }
        const selected = state === 'reset';
        if (id === 'Q1') return `${commonHead}<div class="e17-body">${grid(selected)}${selected ? '' : '<div class="e17-alert" role="alert"><i data-lucide="circle-alert" aria-hidden="true"></i><span>Choisissez au moins un vêtement.</span></div>'}</div>${normalFooter(!selected)}`;
        if (id === 'Q2') return `${commonHead}<div class="e17-body">${grid(selected)}</div><div class="e17-footer">${selected ? '<button type="button" class="e17-secondary"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Réinitialiser</button><button type="button" class="e17-primary"><i data-lucide="check" aria-hidden="true"></i>Tenue prête</button>' : '<button type="button" class="e17-primary e17-solo"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Restaurer la proposition</button>'}</div>`;
        return `${commonHead}<div class="e17-body">${grid(selected, true)}</div>${normalFooter(false)}`;
      }
      function option(id, title, recommended) {
        return `<section aria-label="${id} ${title}"><div class="e17-option-heading"><strong>${id} — ${title}</strong>${recommended ? '<span class="e17-recommended">Recommandé</span>' : ''}</div><div class="e17-stage"><div class="e17-backdrop-page"><div class="e17-brand"><span class="e17-brand-mark">R</span><span class="e17-theme-dot"></span></div><div class="e17-weather-strip"></div><div class="e17-routine-card"></div></div><div class="e17-veil"></div><div class="e17-panel">${proposalBody(id)}</div></div></section>`;
      }
      function render() {
        root.dataset.format = model.format;
        root.dataset.dark = String(model.dark);
        stateLabel.textContent = states[model.state];
        list.innerHTML = option('Q1', 'Continuité calme', true) + option('Q2', 'Action contextuelle', false) + option('Q3', 'Repli manuel', false);
        if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 18, height: 18 } });
      }
      render();
      globalThis.renderRoutineE17 = (next = {}) => { Object.assign(model, next); render(); };
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(model, 'state', { label: 'État', options: [{ label: 'Chargement initial', value: 'loading' }, { label: 'Météo indisponible', value: 'unavailable' }, { label: 'Sélection vide', value: 'empty' }, { label: 'Après réinitialisation', value: 'reset' }], reference: 'panel.state' });
        tweak.addSelect(model, 'format', { label: 'Format', options: ['desktop', 'tablet', 'mobile'], reference: 'panel.format' });
        tweak.addToggle(model, 'dark', { label: 'Mode sombre', reference: 'theme.dark' });
      }
    })();
  </script>
