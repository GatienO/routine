  <div class="e16-controls" aria-label="Sélection, format et apparence">
    <label class="e16-field">Sélection<select class="e16-select" data-selection><option value="all">Tout sélectionné</option><option value="two" selected>Deux retirés</option></select></label>
    <button type="button" class="e16-control" data-format="mobile" aria-pressed="false">Mobile</button>
    <button type="button" class="e16-control" data-format="tablet" aria-pressed="true">Tablette</button>
    <button type="button" class="e16-control" data-format="desktop" aria-pressed="false">Bureau</button>
    <button type="button" class="e16-control" data-appearance aria-pressed="false">☾ Sombre</button>
  </div>
  <div class="e16-grid">
    <section class="e16-option"><div class="e16-label"><h3>S1 · Grille calme</h3><p>Image, nom et coche dans de grandes cartes.</p><span class="e16-recommended">Recommandé</span></div><div data-mount data-strategy="s1"></div></section>
    <section class="e16-option"><div class="e16-label"><h3>S2 · Liste par moments</h3><p>À enfiler, puis les protections pour sortir.</p></div><div data-mount data-strategy="s2"></div></section>
    <section class="e16-option"><div class="e16-label"><h3>S3 · Deux zones</h3><p>Les vêtements conservés et ceux mis de côté.</p></div><div data-mount data-strategy="s3"></div></section>
  </div>

      <div class="e16-context" aria-hidden="true"><div class="e16-context-head"><span class="e16-brand">R<i></i></span><span class="e16-theme-dot"></span></div><div class="e16-context-weather"></div><div class="e16-context-routine"></div></div>

      </section>
    </div>
  </template>

      };
      const formats=root.querySelectorAll('[data-format]');
      const appearance=root.querySelector('[data-appearance]');
      const selectionControl=root.querySelector('[data-selection]');
      const checked=id=>selected.has(id);
      const card=id=>`<button type="button" class="e16-item-card" data-item="${id}" role="checkbox" aria-checked="${checked(id)}" aria-label="${checked(id)?'Retirer':'Ajouter'} ${items[id].label}"><img alt="" src="${items[id].src}"><span class="e16-item-name">${items[id].label}</span><span class="e16-check" aria-hidden="true"><i data-lucide="check"></i></span></button>`;
      const row=id=>`<button type="button" class="e16-list-row" data-item="${id}" role="checkbox" aria-checked="${checked(id)}" aria-label="${checked(id)?'Retirer':'Ajouter'} ${items[id].label}"><img alt="" src="${items[id].src}"><span>${items[id].label}</span><i class="e16-list-check" aria-hidden="true"><i data-lucide="check"></i></i></button>`;
      const zoneItem=(id,active)=>`<button type="button" class="e16-zone-item" data-item="${id}" aria-label="${active?'Retirer':'Ajouter'} ${items[id].label}"><img alt="" src="${items[id].src}"><span>${items[id].label}</span></button>`;
      const renderBodies=()=>{
        root.querySelectorAll('.e16-screen').forEach(screen=>{
          const body=screen.querySelector('[data-body]');
          if(screen.dataset.strategy==='s1')body.innerHTML=`<h3 class="e16-section-heading">Proposition du jour</h3><div class="e16-item-grid">${allIds.map(card).join('')}</div>`;
          if(screen.dataset.strategy==='s2')body.innerHTML=`<div class="e16-list-group"><h3 class="e16-list-title">À enfiler</h3>${['tshirtML','pull','pantalon'].map(row).join('')}</div><div class="e16-list-group"><h3 class="e16-list-title">Pour sortir</h3>${['impermeable','bottes','parapluie'].map(row).join('')}</div>`;
          if(screen.dataset.strategy==='s3'){
            const active=allIds.filter(checked),aside=allIds.filter(id=>!checked(id));
            body.innerHTML=`<div class="e16-zone"><div class="e16-zone-head"><strong>Pour aujourd’hui</strong><span>${active.length}</span></div>${active.length?`<div class="e16-zone-items">${active.map(id=>zoneItem(id,true)).join('')}</div>`:'<p class="e16-empty-zone">Aucun vêtement sélectionné</p>'}</div><div class="e16-zone"><div class="e16-zone-head"><strong>De côté</strong><span>${aside.length}</span></div>${aside.length?`<div class="e16-zone-items">${aside.map(id=>zoneItem(id,false)).join('')}</div>`:'<p class="e16-empty-zone">Rien pour le moment</p>'}</div>`;
          }
        });
        root.querySelectorAll('[data-item]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.item;selected.has(id)?selected.delete(id):selected.add(id);state.selection=selected.size===allIds.length?'all':'two';selectionControl.value=state.selection;renderBodies()}));
        root.querySelectorAll('[data-reset]').forEach(button=>button.onclick=()=>{selected=new Set(allIds);state.selection='all';selectionControl.value='all';renderBodies()});
        if(globalThis.lucide)lucide.createIcons({attrs:{'stroke-width':1.75}});
      };
      const render=()=>{
        root.style.colorScheme=state.dark?'dark':'light';
        root.classList.toggle('e16-dark',state.dark);
        root.classList.toggle('e16-mobile',state.format==='mobile');
        root.classList.toggle('e16-tablet',state.format==='tablet');
        root.classList.toggle('e16-desktop',state.format==='desktop');
        appearance.setAttribute('aria-pressed',String(state.dark));
        appearance.textContent=state.dark?'☀ Clair':'☾ Sombre';
        formats.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.format===state.format)));
        selected=state.selection==='all'?new Set(allIds):new Set(['pull','impermeable','pantalon','bottes']);
        renderBodies();
      };
      formats.forEach(button=>button.addEventListener('click',()=>{state.format=button.dataset.format;render()}));
      appearance.addEventListener('click',()=>{state.dark=!state.dark;render()});
      selectionControl.addEventListener('change',()=>{state.selection=selectionControl.value;render()});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{selectionControl.value=state.selection;render()}});tweak.addSelect(state,'selection',{label:'Sélection',options:[{label:'Tout sélectionné',value:'all'},{label:'Deux retirés',value:'two'}],reference:'outfit.selection'});tweak.addSelect(state,'format',{label:'Format',options:[{label:'Mobile',value:'mobile'},{label:'Tablette',value:'tablet'},{label:'Bureau',value:'desktop'}],reference:'viewport.format'});tweak.addToggle(state,'dark',{label:'Mode sombre',reference:'appearance.dark'})}
    })();
  </script>
