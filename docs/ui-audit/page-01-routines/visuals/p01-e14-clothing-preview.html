<div id="p01-e14-clothing-preview" aria-label="Trois stratégies pour l’aperçu des vêtements">
  <style>
    #p01-e14-clothing-preview{width:100%;color-scheme:light;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:light-dark(#303743,#F5F3ED)}
    #p01-e14-clothing-preview *{box-sizing:border-box}
    #p01-e14-clothing-preview button,#p01-e14-clothing-preview select{font:inherit}
    #p01-e14-clothing-preview .e14-controls{display:flex;justify-content:center;align-items:end;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    #p01-e14-clothing-preview .e14-field{display:grid;gap:5px;color:light-dark(#68707B,#B5BDC8)}
    #p01-e14-clothing-preview .e14-select,#p01-e14-clothing-preview .e14-control{min-height:44px;padding:0 14px;border:1px solid light-dark(#DEDFDC,#394351);border-radius:14px;background:light-dark(#FFFFFF,#222834);color:light-dark(#303743,#F5F3ED);font-weight:500}
    #p01-e14-clothing-preview .e14-control{cursor:pointer}
    #p01-e14-clothing-preview .e14-control[aria-pressed="true"]{background:light-dark(#B8DFCF,#31594C);border-color:transparent;color:light-dark(#2F6E59,#A9DDC8)}
    #p01-e14-clothing-preview .e14-grid{display:grid;gap:18px}
    #p01-e14-clothing-preview .e14-option{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start;min-width:0}
    #p01-e14-clothing-preview .e14-label{padding-top:18px}
    #p01-e14-clothing-preview .e14-label h3{margin:0;font-weight:500}
    #p01-e14-clothing-preview .e14-label p{margin:6px 0 0;color:light-dark(#68707B,#B5BDC8)}
    #p01-e14-clothing-preview .e14-recommended{display:inline-flex;margin-top:10px;padding:6px 10px;border-radius:999px;background:light-dark(#D8D0F2,#453E60);color:light-dark(#584C85,#E2DCF8);font-weight:500}
    #p01-e14-clothing-preview .e14-screen{position:relative;min-height:250px;overflow:hidden;border:1px solid light-dark(#DEDFDC,#394351);border-radius:28px;background:light-dark(#F7F5EF,#171B23);box-shadow:0 12px 28px rgba(48,55,67,.10)}
    #p01-e14-clothing-preview .e14-orb{position:absolute;width:150px;height:150px;right:-72px;top:-74px;border-radius:50%;background:light-dark(#D8D0F2,#453E60);opacity:.55;pointer-events:none}
    #p01-e14-clothing-preview .e14-layout{position:relative;z-index:2;width:calc(100% - 64px);max-width:1320px;margin:0 auto;padding-bottom:22px}
    #p01-e14-clothing-preview.e14-tablet .e14-layout{width:calc(100% - 48px)}
    #p01-e14-clothing-preview.e14-mobile .e14-layout{width:calc(100% - 32px)}
    #p01-e14-clothing-preview .e14-floating{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
    #p01-e14-clothing-preview .e14-logo{position:relative;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:15px;background:light-dark(#B8DFCF,#31594C);color:light-dark(#397862,#A9DDC8);font-weight:500;box-shadow:0 6px 16px rgba(48,55,67,.12)}
    #p01-e14-clothing-preview .e14-logo i{position:absolute;right:7px;bottom:7px;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:-7px 3px currentColor,-12px -1px currentColor}
    #p01-e14-clothing-preview .e14-theme{display:grid;place-items:center;width:44px;height:44px;border:1px solid light-dark(#DEDFDC,#394351);border-radius:50%;background:light-dark(#FFFFFF,#222834);color:inherit;box-shadow:0 6px 16px rgba(48,55,67,.12);cursor:pointer}
    #p01-e14-clothing-preview .e14-theme svg{width:20px;height:20px;stroke-width:1.75}
    #p01-e14-clothing-preview .e14-theme .e14-sun{display:none}
    #p01-e14-clothing-preview.e14-dark .e14-theme .e14-moon{display:none}
    #p01-e14-clothing-preview.e14-dark .e14-theme .e14-sun{display:block}
    #p01-e14-clothing-preview .e14-banner{display:flex;align-items:center;gap:18px;min-height:142px;padding:15px 16px;border-radius:24px;background:light-dark(#BFE1EF,#304F5E)}
    #p01-e14-clothing-preview .e14-art{position:relative;display:grid;place-items:center;width:112px;height:112px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:light-dark(#FFF3D8,#493E35);box-shadow:0 8px 18px rgba(48,55,67,.14)}
    #p01-e14-clothing-preview .e14-paper-sun{position:absolute;width:54px;height:54px;right:4px;top:7px;border-radius:50%;background:light-dark(#FFC652,#E8A944);box-shadow:5px 5px 0 light-dark(#F0A95A,#835736)}
    #p01-e14-clothing-preview .e14-paper-cloud{position:absolute;width:78px;height:36px;left:10px;top:45px;border-radius:25px;background:light-dark(#F8FCFD,#D8E5EC);box-shadow:5px 6px 0 light-dark(#79BCD6,#365D70)}
    #p01-e14-clothing-preview .e14-paper-cloud::before{content:"";position:absolute;width:43px;height:43px;left:12px;top:-21px;border-radius:50%;background:inherit}
    #p01-e14-clothing-preview .e14-paper-cloud::after{content:"";position:absolute;width:32px;height:32px;right:7px;top:-13px;border-radius:50%;background:inherit}
    #p01-e14-clothing-preview .e14-paper-drop{position:absolute;width:10px;height:18px;border-radius:10px 10px 12px 12px;background:light-dark(#3C93D4,#68BEF4);box-shadow:3px 3px 0 light-dark(#236C9F,#285D7D);transform:rotate(13deg)}
    #p01-e14-clothing-preview .e14-paper-drop.d1{left:27px;top:84px}.e14-paper-drop.d2{left:51px;top:91px}.e14-paper-drop.d3{left:76px;top:83px}
    #p01-e14-clothing-preview .e14-copy{flex:1;min-width:150px}
    #p01-e14-clothing-preview .e14-copy h2{margin:0;font-weight:500}
    #p01-e14-clothing-preview .e14-clothes{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:226px}
    #p01-e14-clothing-preview .e14-clothing,#p01-e14-clothing-preview .e14-more{display:grid;place-items:center;width:52px;height:52px;flex:0 0 auto;border-radius:17px;background:light-dark(rgba(255,255,255,.68),rgba(34,40,52,.74))}
    #p01-e14-clothing-preview .e14-clothing img{display:block;width:43px;height:43px;object-fit:contain}
    #p01-e14-clothing-preview .e14-more{color:light-dark(#59636E,#D9DEE5);font-weight:500}
    #p01-e14-clothing-preview .e14-action{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border:1px solid light-dark(#D5DBDC,#5B7080);border-radius:14px;background:light-dark(#FFFFFF,#222834);color:light-dark(#447889,#A8D7E5);cursor:pointer;box-shadow:0 4px 12px rgba(48,55,67,.10)}
    #p01-e14-clothing-preview .e14-action svg{width:18px;height:18px;stroke-width:1.75}
    #p01-e14-clothing-preview .strategy-h3 .e14-clothes{min-width:344px}
    #p01-e14-clothing-preview.e14-mobile .e14-option{grid-template-columns:165px minmax(0,390px)}
    #p01-e14-clothing-preview.e14-mobile .e14-screen{min-height:290px}
    #p01-e14-clothing-preview.e14-mobile .e14-banner{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;grid-template-rows:auto auto;gap:8px 10px;min-height:178px;padding:14px 12px}
    #p01-e14-clothing-preview.e14-mobile .e14-art{grid-row:1 / span 2;width:96px;height:96px}
    #p01-e14-clothing-preview.e14-mobile .e14-copy{min-width:0;align-self:end}
    #p01-e14-clothing-preview.e14-mobile .e14-clothes{grid-column:2;justify-content:flex-start;align-self:start;gap:4px;min-width:0;flex-wrap:nowrap}
    #p01-e14-clothing-preview.e14-mobile .e14-clothing,#p01-e14-clothing-preview.e14-mobile .e14-more{width:31px;height:31px;border-radius:10px}
    #p01-e14-clothing-preview.e14-mobile .e14-clothing img{width:28px;height:28px}
    #p01-e14-clothing-preview.e14-mobile .e14-action{grid-column:3;grid-row:1 / span 2;align-self:center}
    #p01-e14-clothing-preview.e14-mobile .strategy-h3{min-height:214px}
    #p01-e14-clothing-preview.e14-mobile .strategy-h3 .e14-clothes{display:grid;grid-template-columns:repeat(3,31px);min-width:0}
    #p01-e14-clothing-preview .is-empty .e14-clothes{display:none}
    @media(max-width:800px){#p01-e14-clothing-preview .e14-option{grid-template-columns:1fr}#p01-e14-clothing-preview .e14-label{padding-top:0}#p01-e14-clothing-preview.e14-mobile .e14-option{grid-template-columns:1fr}#p01-e14-clothing-preview.e14-mobile .e14-screen{width:100%;max-width:390px}}
    @media(max-width:440px){#p01-e14-clothing-preview.e14-mobile .e14-banner{grid-template-columns:76px minmax(0,1fr) 44px}#p01-e14-clothing-preview.e14-mobile .e14-art{width:76px;height:76px}#p01-e14-clothing-preview.e14-mobile .e14-clothing,#p01-e14-clothing-preview.e14-mobile .e14-more{width:26px;height:26px;border-radius:8px}#p01-e14-clothing-preview.e14-mobile .e14-clothing img{width:24px;height:24px}#p01-e14-clothing-preview.e14-mobile .strategy-h3 .e14-clothes{grid-template-columns:repeat(3,26px)}}
  </style>
  <div class="e14-controls" aria-label="Tenue, format et apparence">
    <label class="e14-field">Proposition<select class="e14-select" data-outfit-select><option value="six" selected>Six vêtements</option><option value="four">Quatre vêtements</option><option value="empty">Aucune recommandation</option></select></label>
    <button type="button" class="e14-control" data-format="mobile" aria-pressed="false">Mobile</button>
    <button type="button" class="e14-control" data-format="tablet" aria-pressed="true">Tablette</button>
    <button type="button" class="e14-control" data-format="desktop" aria-pressed="false">Bureau</button>
    <button type="button" class="e14-control" data-appearance aria-pressed="false">☾ Sombre</button>
  </div>
  <div class="e14-grid">
    <section class="e14-option"><div class="e14-label"><h3>H1 · Quatre essentiels</h3><p>Une sélection par zone et priorité météo.</p><span class="e14-recommended">Recommandé</span></div><div data-mount data-strategy="h1"></div></section>
    <section class="e14-option"><div class="e14-label"><h3>H2 · Trois et un compteur</h3><p>Trois vêtements visibles, puis le nombre restant.</p></div><div data-mount data-strategy="h2"></div></section>
    <section class="e14-option"><div class="e14-label"><h3>H3 · Tenue complète</h3><p>Jusqu’à six vêtements, en deux lignes sur mobile.</p></div><div data-mount data-strategy="h3"></div></section>
  </div>
  <template id="e14-screen-template">
    <div class="e14-screen"><i class="e14-orb" aria-hidden="true"></i><div class="e14-layout">
      <div class="e14-floating"><button class="e14-logo" type="button" aria-label="Retour à Routines">R<i></i></button><button class="e14-theme" type="button" aria-label="Activer le mode sombre"><i class="e14-moon" data-lucide="moon" aria-hidden="true"></i><i class="e14-sun" data-lucide="sun" aria-hidden="true"></i></button></div>
      <section class="e14-banner" data-banner aria-label="Pluie légère, 13 degrés. Tenue proposée.">
        <div class="e14-art" role="img" aria-label="Pluie légère représentée en papier découpé"><i class="e14-paper-sun" aria-hidden="true"></i><i class="e14-paper-cloud" aria-hidden="true"></i><i class="e14-paper-drop d1" aria-hidden="true"></i><i class="e14-paper-drop d2" aria-hidden="true"></i><i class="e14-paper-drop d3" aria-hidden="true"></i></div>
        <div class="e14-copy"><h2>Pluie légère · 13°</h2></div>
        <div class="e14-clothes" data-clothes aria-label="Tenue proposée"></div>
        <button class="e14-action" type="button" aria-label="Modifier la météo et les vêtements"><i data-lucide="pencil" aria-hidden="true"></i></button>
      </section>
    </div></div>
  </template>

      const htmlFor=id=>`<span class="e14-clothing"><img alt="${items[id].label}" src="${items[id].src}"></span>`;
      const render=()=>{
        root.style.colorScheme=state.dark?'dark':'light';
        root.classList.toggle('e14-dark',state.dark);
        root.classList.toggle('e14-mobile',state.format==='mobile');
        root.classList.toggle('e14-tablet',state.format==='tablet');
        root.classList.toggle('e14-desktop',state.format==='desktop');
        appearance.setAttribute('aria-pressed',String(state.dark));
        appearance.textContent=state.dark?'☀ Clair':'☾ Sombre';
        formats.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.format===state.format)));
        root.querySelectorAll('.e14-theme').forEach(button=>button.setAttribute('aria-label',state.dark?'Activer le mode clair':'Activer le mode sombre'));
        root.querySelectorAll('[data-banner]').forEach(banner=>{
          const strategy=banner.dataset.strategy;
          const empty=state.outfit==='empty';
          const source=state.outfit==='four'?four:full;
          let shown=[];
          let extra=0;
          if(!empty&&strategy==='h1')shown=four.filter(id=>source.includes(id)).slice(0,4);
          if(!empty&&strategy==='h2'){shown=['impermeable','pantalon','bottes'].filter(id=>source.includes(id));extra=Math.max(0,source.length-shown.length)}
          if(!empty&&strategy==='h3')shown=source.slice(0,6);
          banner.classList.toggle('is-empty',empty);
          const clothes=banner.querySelector('[data-clothes]');
          clothes.innerHTML=shown.map(htmlFor).join('')+(extra?`<span class="e14-more" aria-label="${extra} autres vêtements">+${extra}</span>`:'');
          const labels=shown.map(id=>items[id].label);
          clothes.setAttribute('aria-label',empty?'Aucune recommandation de tenue':`Tenue proposée : ${labels.join(', ')}${extra?`, et ${extra} autres`:''}`);
          banner.setAttribute('aria-label',empty?'Pluie légère, 13 degrés. Aucune recommandation de tenue.':'Pluie légère, 13 degrés. '+clothes.getAttribute('aria-label'));
        });
        if(globalThis.lucide)lucide.createIcons({attrs:{'stroke-width':1.75}});
      };
      formats.forEach(button=>button.addEventListener('click',()=>{state.format=button.dataset.format;render()}));
      appearance.addEventListener('click',()=>{state.dark=!state.dark;render()});
      selector.addEventListener('change',()=>{state.outfit=selector.value;render()});
      root.querySelectorAll('.e14-theme').forEach(button=>button.addEventListener('click',()=>{state.dark=!state.dark;render()}));
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{selector.value=state.outfit;render()}});tweak.addSelect(state,'outfit',{label:'Proposition',options:[{label:'Six vêtements',value:'six'},{label:'Quatre vêtements',value:'four'},{label:'Aucune recommandation',value:'empty'}],reference:'outfit.preview'});tweak.addSelect(state,'format',{label:'Format',options:[{label:'Mobile',value:'mobile'},{label:'Tablette',value:'tablet'},{label:'Bureau',value:'desktop'}],reference:'viewport.format'});tweak.addToggle(state,'dark',{label:'Mode sombre',reference:'appearance.dark'})}
    })();
  </script>
</div>
