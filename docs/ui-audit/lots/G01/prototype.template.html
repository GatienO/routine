<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routine — Prototype G01</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eae8;color:#303743;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #756fb0;outline-offset:3px}button svg{pointer-events:none}.review{max-width:1320px;margin:auto;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.review strong{font-size:16px}.review small{display:block;font-size:12px;color:#59616b}.review label{font-size:12px;display:flex;gap:8px;align-items:center}.review select{min-height:44px;border:1px solid #b8bec3;border-radius:8px;padding:8px;background:white;color:#303743}.review button{min-height:44px;padding:8px 12px;border:1px solid #b8bec3;border-radius:8px;background:white;color:#303743}.review .status{font-size:12px;margin-left:auto;max-width:270px}.stage{padding:0 16px 24px}.app{--bg:#f7f5ef;--surface:#fff;--muted:#efeee9;--text:#303743;--secondary:#68707b;--border:#dedfdc;--action:#397862;--soft:#b8dfcf;--time:#d8d0f2;--sky:#bfe1ef;--apricot:#ffd8ae;--error:#984d49;position:relative;isolation:isolate;margin:auto;width:390px;max-width:100%;height:min(844px,calc(100dvh - 110px));display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden;border:1px solid #b8bec3;border-radius:8px;box-shadow:0 8px 30px #30374310}.app.dark{--bg:#171b23;--surface:#222834;--muted:#2c3340;--text:#f5f3ed;--secondary:#b5bdc8;--border:#394351;--action:#a9ddc8;--soft:#31594c;--time:#453e60;--sky:#304f5e;--apricot:#5b4633;--error:#f0aba5}.app::before,.app::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;z-index:-1;pointer-events:none;opacity:.4}.app::before{background:var(--time);right:-145px;top:-140px}.app::after{background:var(--sky);left:-175px;top:480px}.app button{min-width:44px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px;min-height:44px}.app button:focus-visible,.app input:focus-visible{outline-color:var(--action)}.app svg{width:22px;height:22px;fill:currentColor;flex-shrink:0}.chrome{height:68px;min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;width:100%;max-width:1320px;margin:0 auto;gap:12px}.app .brand{width:44px;height:44px;position:relative;background:var(--soft);color:var(--action);border:0;font-size:21px;font-weight:650}.brand i{position:absolute;width:5px;height:5px;background:var(--action);border-radius:50%;bottom:7px;right:12px}.brand i:nth-child(2){width:4px;height:4px;bottom:10px;right:6px}.brand i:nth-child(3){width:3px;height:3px;bottom:16px;right:5px}.app .theme{border-radius:50%;width:44px;display:grid;place-items:center}.pages{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}.content{max-width:1320px;width:100%;margin:auto;padding:20px 24px 24px;display:grid;gap:20px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.muted{color:var(--secondary);font-size:14px;line-height:1.5}.eyebrow{font-size:12px;letter-spacing:.5px;font-weight:650;color:var(--action)}h1,h2,h3,p{margin:0}h1{font-size:30px;line-height:1.25;letter-spacing:-.6px;font-weight:650}h2{font-size:22px;line-height:1.3;font-weight:650}h3{font-size:17px;font-weight:650}.weather{background:var(--sky);border:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.weather .emoji{font-size:36px;background:var(--surface);border-radius:50%;width:64px;height:64px;display:grid;place-items:center}.weather .muted{margin-top:4px}.weather h2{margin-top:4px}.weather button{padding:0 16px}.clothes{font-size:20px;letter-spacing:4px}.main-grid{display:grid;gap:16px}.routine{display:grid;gap:24px}.routine-title{display:flex;align-items:center;gap:14px}.sun{width:62px;height:62px;border-radius:50%;background:var(--apricot);display:grid;place-items:center;font-size:32px;flex-shrink:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:122px;font-size:13px;font-weight:650;text-align:center;line-height:1.45}.steps b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--muted);color:var(--action);margin:0 auto 12px}.app .primary{background:var(--action);color:var(--surface);border:0;min-height:52px;padding:12px 16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}.app.dark .primary{color:var(--bg)}.calendar{display:grid;gap:12px}.calendar-inner{border-radius:18px;background:var(--time);padding:18px;display:grid;gap:24px}.app .quiet{padding:8px 12px;background:transparent;border:0;font-size:13px}.secondary-routine{display:flex;gap:12px;align-items:center}.app .play{width:48px;background:var(--soft);border:0;color:var(--action)}.heading{display:grid;gap:8px}.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:5px;background:var(--muted);border-radius:18px;max-width:100%}.app .tabs button{padding:8px 12px;background:transparent;border:0;font-size:14px}.app .tabs button[aria-selected=true]{background:var(--surface)}.search{border:1px solid var(--border);border-radius:18px;background:var(--surface);min-height:48px;display:flex;gap:10px;align-items:center;padding:10px 14px}.search input{width:100%;min-width:0;background:transparent;border:0;color:var(--text);font-size:16px;outline-offset:6px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.app .surprise{background:var(--apricot);border:0;padding:10px 16px;font-weight:650}.activity{display:grid;gap:12px}.activity-title{display:flex;gap:12px;align-items:center}.activity-title .emoji{font-size:32px;background:var(--time);border-radius:14px;padding:12px}.tools{display:grid;gap:12px}.tool{display:flex;align-items:center;gap:14px}.tool .tool-icon{width:48px;height:48px;border-radius:14px;background:var(--muted);display:grid;place-items:center}.bottom{flex:none;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}.nav-inner{height:76px;max-width:720px;margin:auto;display:flex}.app .nav-item{flex:1;min-width:0;border:0;background:transparent;border-radius:0;color:var(--secondary);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600}.nav-item[aria-current=page]{color:var(--action)}.nav-item[aria-current=page]::before{content:'';position:absolute;top:6px;width:26px;height:3px;border-radius:2px;background:var(--action)}.nav-icon{position:relative;display:flex}.nav-icon .lock{position:absolute;right:-7px;top:-3px;width:13px;height:13px;background:var(--surface)}.pin{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}.pin-header{justify-content:flex-start;position:sticky;top:0;background:var(--bg);z-index:3}.pin-body{flex-shrink:0}.nav-icon .lock svg{width:13px;height:13px}.app .back{width:44px;display:grid;place-items:center}.pin-header .theme{margin-left:auto}.pin-body{width:min(100%,400px);margin:auto;padding:20px 24px 28px;text-align:center;display:grid;gap:20px}.lock-title{color:var(--action);display:grid;place-items:center;margin:auto;width:64px;height:64px;background:var(--soft);border-radius:18px}.lock-title svg{width:30px;height:30px}.pin-copy{display:grid;gap:8px}.dots{display:flex;gap:16px;justify-content:center;min-height:28px;align-items:center}.dot{width:14px;height:14px;border:2px solid var(--secondary);border-radius:50%}.dot.filled{background:var(--action);border-color:var(--action)}.pin-error{min-height:22px;color:var(--error);font-size:14px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.app .key{height:64px;font-size:26px;font-weight:600;display:grid;place-items:center;background:var(--surface)}.app .cancel{color:var(--secondary);background:transparent;border:0;font-size:14px}.app .empty-key{visibility:hidden}.capture .review{display:none}.capture .stage{padding:0}.capture .app{width:100%!important;height:100dvh!important;border:0;border-radius:0;box-shadow:none}.notice{position:absolute;bottom:86px;left:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:13px;box-shadow:0 4px 20px #0001;z-index:4}.notice:empty{display:none}.app.wide .chrome{padding-left:24px;padding-right:24px}.app.wide .main-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.app.wide .routine{min-height:380px}.app.wide .tools{grid-template-columns:1fr 1fr}.app.wide .pin-body{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:32px;width:400px}.app.wide .key{background:var(--bg)}.app.wide .content{padding:24px}.hidden{display:none!important}@media(max-width:420px){.stage{padding:0}.app{border-radius:0;border:0}.review{padding:12px;gap:10px}.content{padding:16px;gap:18px}.panel{padding:16px}h1{font-size:28px}.pin-body{padding:16px 24px}.review .status{margin-left:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header class="review"><div><strong>G01 · Navigation, retours et PIN</strong><small>Prototype de décision · contenu de contexte · aucune donnée réelle</small></div><label>Format<select id="format"><option value="390">Mobile · 390</option><option value="320">Petit mobile · 320</option><option value="768">Tablette · 768</option><option value="1440">Bureau · 1440</option></select></label><label>État PIN<select id="pin-state"><option value="entry">Saisie</option><option value="error">Code incorrect</option><option value="setup">Création</option><option value="confirm">Confirmation</option></select></label><button id="demo-parent">Aperçu Parent</button><span class="status" id="review-status">PIN fictif de démonstration : 1234.</span></header>
<div class="stage"><section id="app" class="app" aria-label="Prototype de Routine"><header id="main-header" class="chrome"><button class="brand" data-go="routines" aria-label="Revenir aux routines">R<i></i><i></i><i></i></button><button class="theme" aria-label="Passer au mode sombre"></button></header><main id="pages" class="pages"><div id="content" class="content"></div></main><section id="pin" class="pin hidden" aria-label="Accès Parent"><header class="chrome pin-header"><button class="back" id="pin-back" aria-label="Annuler et revenir"></button><span class="muted" id="return-label">Retour à Routines</span><button class="theme" aria-label="Passer au mode sombre"></button></header><div class="pin-body"><div class="lock-title" id="lock-title"></div><div class="pin-copy"><h1 id="pin-title">Espace parent</h1><p class="muted" id="pin-help">Entrez votre code à 4 chiffres.</p></div><div class="dots" id="dots" role="status" aria-label="0 chiffre saisi sur 4"></div><p id="pin-error" class="pin-error" role="alert"></p><div class="keypad" id="keypad"></div><button id="pin-cancel" class="cancel">Annuler</button></div></section><nav id="bottom" class="bottom" aria-label="Navigation principale"><div class="nav-inner" id="nav"></div></nav><div id="notice" class="notice" role="status"></div></section></div>
<script>
const icons=__ICONS__;
const icon=name=>`<svg viewBox="0 0 256 256" aria-hidden="true">${icons[name]||icons.Check}</svg>`;
const app=document.getElementById('app'),content=document.getElementById('content'),pages=document.getElementById('pages');
const params=new URLSearchParams(location.search);let route=params.get('page')||'routines',origin='routines',dark=params.get('theme')==='dark',unlocked=false,digits='',pinMode=params.get('state')||'entry',savedPositions={},collection='discover',searchText='';
const label={routines:'Routines',activities:'Activités',parent:'Parent'};const names={routines:'Check',activities:'Sparkle',parent:'GearSix'};
if(params.get('capture')==='1')document.body.classList.add('capture');
function toast(text){document.getElementById('notice').textContent=text;clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>document.getElementById('notice').textContent='',3500)}
function theme(){app.classList.toggle('dark',dark);document.querySelectorAll('.theme').forEach(b=>{b.innerHTML=icon(dark?'Sun':'Moon');b.setAttribute('aria-label',dark?'Passer au mode clair':'Passer au mode sombre')})}
document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{dark=!dark;theme()});
function nav(){document.getElementById('nav').innerHTML=Object.keys(label).map(key=>`<button class="nav-item" data-go="${key}" ${route===key?'aria-current="page"':''} aria-label="${label[key]}${key==='parent'?', '+(unlocked?'déverrouillé':'verrouillé'):''}"><span class="nav-icon">${icon(names[key])}${key==='parent'&&!unlocked?`<span class="lock">${icon('LockSimple')}</span>`:''}</span>${label[key]}</button>`).join('')}
const routine=()=>`<section class="panel weather"><div class="emoji">🌤️</div><div class="grow"><div class="eyebrow">MÉTÉO DU JOUR</div><h2>21° · Éclaircies</h2><p class="muted">Une tenue confortable suffit</p></div><div class="row"><span class="clothes">🧦 👟 👖 👕</span><button data-context>Adapter</button></div></section><div class="main-grid"><section class="panel routine"><div class="eyebrow">PROCHAINE ROUTINE</div><div class="routine-title"><span class="sun">☀️</span><div><h2>Super matin</h2><p class="muted">Emma · 8 étapes · 24 min 30 s</p></div></div><div class="steps"><div><b>1</b>Je me lève</div><div><b>2</b>Je vais aux toilettes</div><div><b>3</b>Je me lave le visage</div></div><button class="primary" data-context>${icon('Play')}Lancer avec Emma</button></section><section class="panel calendar"><h3>Aujourd’hui</h3><div class="calendar-inner"><div><h3>Le petit calendrier</h3><p class="muted">Maintenant et après, simplement.</p></div><p class="muted">Aujourd’hui · Temps calme</p><button class="quiet" data-context>Voir toute la journée →</button></div></section></div><div class="toolbar"><div><h2>Autres routines</h2><p class="muted">1 disponible</p></div><div class="row"><button class="quiet" data-context>Enchaîner</button><button class="quiet" data-context>Gérer</button><button class="quiet" data-context>Créer</button></div></div><section class="panel secondary-routine"><span class="sun">☀️</span><div class="grow"><h3>Super matin du week-end</h3><p class="muted">8 étapes · 24 min 30 s<br>Emma</p></div><button class="play" aria-label="Préparer la routine" data-context>${icon('Play')}</button></section>`;
function activities(){return `<div class="heading"><div class="eyebrow">IDÉES À PARTAGER</div><h1>Une idée pour maintenant.</h1><p class="muted">Trouvez une activité simple selon le temps et l’énergie du parent.</p></div><div class="tabs" role="tablist" aria-label="Collections">${[['discover','Découvrir'],['favorites','Favoris'],['recent','Récentes']].map(([v,l])=>`<button role="tab" aria-selected="${v===collection}" data-collection="${v}">${l}</button>`).join('')}</div>${collection==='discover'?`<label class="search">${icon('MagnifyingGlass')}<input aria-label="Recherche" placeholder="5 min, calme, dehors…"></label><div><button class="surprise" data-context>Me surprendre</button></div><div class="toolbar"><span class="muted">98 idées</span><div class="row"><button class="quiet" data-context>Effacer</button><button class="primary" data-context>Filtrer</button></div></div><div class="toolbar"><h2>À découvrir</h2><span class="muted">98 idées</span></div><div class="eyebrow">SUGGESTION DU MOMENT</div><section class="panel activity"><div class="activity-title"><span class="emoji">🤫</span><div><div class="eyebrow">CALME</div><h2>Défi silence</h2></div></div><p>Écouter les sons autour de soi en silence.</p><p class="muted">5 min · 3–6 ans · Sans matériel</p><button data-context>Ouvrir l’activité</button></section>`:`<section class="panel"><h2>${collection==='favorites'?'Vos favoris':'Consultées récemment'}</h2><p class="muted">Défi silence · 5 min</p></section>`}`}
const parent=()=>`<div class="heading"><div class="eyebrow">ESPACE PARENT</div><h1>Vos outils, au même endroit.</h1><p class="muted">Préparez les routines et les repères. Les enfants participent seulement avec vous.</p></div><div class="row"><button class="primary" data-context>Créer une routine</button><button class="quiet" data-go="routines">Lancer</button></div><div class="toolbar"><h2>Outils</h2><p class="muted">5 intentions, rien de plus</p></div><div class="tools">${[['UsersThree','Famille','Enfants et préférences'],['Check','Routines','Créer et organiser'],['CalendarDots','Calendrier','Préparer les repères'],['ChartLineUp','Progrès','Étoiles et récompenses'],['GearSix','Réglages','Météo, sécurité et données']].map(([i,t,d])=>`<section class="panel tool"><span class="tool-icon">${icon(i)}</span><div class="grow"><h3>${t}</h3><p class="muted">${d}</p></div><button class="quiet" data-context aria-label="Ouvrir ${t}">→</button></section>`).join('')}</div>`;
function render(){const isPin=route==='pin';document.getElementById('main-header').classList.toggle('hidden',isPin);pages.classList.toggle('hidden',isPin);document.getElementById('bottom').classList.toggle('hidden',isPin);document.getElementById('pin').classList.toggle('hidden',!isPin);if(isPin){renderPin();document.getElementById('pin').scrollTop=0}else{content.innerHTML=route==='activities'?activities():route==='parent'?parent():routine();nav();const search=content.querySelector('input');if(search)search.value=searchText;pages.scrollTop=savedPositions[route]||0}theme()}
function go(next){document.getElementById('notice').textContent='';if(route!=='pin')savedPositions[route]=pages.scrollTop;if(next==='parent'&&!unlocked){origin=route;route='pin';digits='';pinMode='entry'}else{if(route==='parent'&&next!=='parent')unlocked=false;route=next}render();if(route==='pin')document.getElementById('pin-back').focus()}
app.addEventListener('input',e=>{if(e.target.matches('input'))searchText=e.target.value});
app.addEventListener('click',e=>{const goButton=e.target.closest('[data-go]');if(goButton)go(goButton.dataset.go);if(e.target.closest('[data-context]'))toast('Contenu de contexte : ce lot porte sur la navigation et le PIN.');const tab=e.target.closest('[data-collection]');if(tab){collection=tab.dataset.collection;content.innerHTML=activities()}});
function renderPin(){document.getElementById('pin-back').innerHTML=icon('ArrowLeft');document.getElementById('lock-title').innerHTML=icon('LockSimple');document.getElementById('return-label').textContent='Retour à '+label[origin];document.getElementById('pin-back').setAttribute('aria-label','Annuler et revenir à '+label[origin]);document.getElementById('pin-title').textContent=pinMode==='setup'?'Créez votre code':pinMode==='confirm'?'Confirmez votre code':'Espace parent';document.getElementById('pin-help').textContent=pinMode==='setup'?'Choisissez un code à 4 chiffres.':pinMode==='confirm'?'Entrez le même code pour confirmer.':'Entrez votre code à 4 chiffres.';document.getElementById('pin-error').textContent=pinMode==='error'?'Code incorrect. Réessayez.':'';document.getElementById('dots').innerHTML=[0,1,2,3].map(i=>`<span class="dot ${i<digits.length?'filled':''}"></span>`).join('');document.getElementById('dots').setAttribute('aria-label',digits.length+' chiffre'+(digits.length>1?'s':'')+' saisi'+(digits.length>1?'s':'')+' sur 4');if(!document.getElementById('keypad').children.length)document.getElementById('keypad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','delete'].map(v=>v?`<button class="key" data-digit="${v}" aria-label="${v==='delete'?'Effacer le dernier chiffre':v}">${v==='delete'?icon('Backspace'):v}</button>`:'<span class="empty-key"></span>').join('')}
function enter(value){if(value==='delete'){digits=digits.slice(0,-1);pinMode='entry';renderPin();return}if(digits.length>=4)return;digits+=value;renderPin();if(digits.length===4){if(digits==='1234'){digits='';unlocked=true;route='parent';render();document.getElementById('review-status').textContent='Démonstration déverrouillée, aucun vrai code enregistré.'}else{digits='';pinMode='error';renderPin()}}}
document.getElementById('keypad').onclick=e=>{const b=e.target.closest('[data-digit]');if(b)enter(b.dataset.digit)};
function cancel(){digits='';route=origin;render();document.getElementById('nav').querySelector('[data-go="parent"]').focus();document.getElementById('review-status').textContent='Annulation : retour à '+label[origin]+', contexte conservé.'}
document.getElementById('pin-back').onclick=cancel;document.getElementById('pin-cancel').onclick=cancel;
document.addEventListener('keydown',e=>{if(route!=='pin')return;if(/^\d$/.test(e.key)){e.preventDefault();enter(e.key)}if(e.key==='Backspace'){e.preventDefault();enter('delete')}if(e.key==='Escape'){e.preventDefault();cancel()}});
document.getElementById('pin-state').onchange=e=>{origin=route==='pin'?origin:route;route='pin';pinMode=e.target.value;digits='';render()};
document.getElementById('demo-parent').onclick=()=>{unlocked=true;route='parent';render();document.getElementById('review-status').textContent='Aperçu Parent simulé, issu du code existant.'};
function resize(){app.classList.toggle('wide',app.clientWidth>=720)}
document.getElementById('format').onchange=e=>{app.style.width=e.target.value+'px';app.style.height=e.target.value==='768'?'1024px':'844px';resize()};new ResizeObserver(resize).observe(app);
if(route==='pin'){origin=params.get('origin')==='activities'?'activities':'routines'}if(route==='parent')unlocked=true;render();resize();
</script></body></html>
