<div class="review"><div><strong>G02 · Contenu plus direct</strong><small>Prototype de décision — données fictives — aucune modification de l’app</small></div><label>Option <select id="variant"><option value="a">A · Tout à portée</option><option value="b">B · Suggestion d’abord</option><option value="c">C · Outils repliables</option></select></label><label>État <select id="state"><option value="normal">Habituel</option><option value="empty">Sans résultat</option><option value="long">Titre long</option></select></label><a href="?board=1">Comparatif mobile</a></div>
<div class="app" id="app"><header class="chrome"><button class="brand" aria-label="Revenir aux routines" data-page="routines">R∙</button><button class="theme" aria-label="Passer au mode sombre"></button></header><main class="pages" id="pages"><div class="content" id="content"></div></main><nav class="bottom" aria-label="Navigation principale"><div class="navinner" id="nav"></div></nav><div id="overlay"></div></div>
<script>
const icons=__ICONS__;const icon=n=>'<svg aria-hidden="true" viewBox="0 0 256 256">'+icons[n]+'</svg>';const q=new URLSearchParams(location.search);let variant=q.get('variant')||'a',page=q.get('page')||'activities',view='discover',state=q.get('state')||'normal',dark=q.get('theme')==='dark',search='',filter=false,expanded=false,fav=false,lastFocus=null;const app=document.getElementById('app'),content=document.getElementById('content');document.getElementById('variant').value=variant;document.getElementById('state').value=state;if(q.has('capture'))document.body.classList.add('capture');
if(q.has('board')){const tablet=q.get('board')==='tablet';document.body.innerHTML='<div class="board">'+[['a','A · Tout à portée','Recherche et deux actions regroupées.'],['b','B · Suggestion d’abord','Une idée avant les outils.'],['c','C · Outils repliables','Recherche visible, autres outils à ouvrir.']].map(([v,t,d])=>'<section><h2>'+t+'</h2><small>'+d+'</small><iframe title="'+t+'" src="?capture=1&variant='+v+'"></iframe></section>').join('')+'</div>';document.body.style.minWidth=tablet?'2380px':'1250px';}else{
function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(name='Défi silence',emoji='🤫',featured=false){return '<article class="card '+(featured?'feature':'')+'"><div class="cardhead"><div class="emoji">'+emoji+'</div><div class="grow">'+(featured?'<p class="tag">Une idée pour maintenant</p>':'')+'<h2>'+esc(state==='long'?'Une exploration des petits sons de la maison, ensemble':name)+'</h2></div><button class="heart" aria-label="'+(fav?'Retirer des favoris':'Ajouter aux favoris')+'" data-fav aria-pressed="'+fav+'">'+icon('Heart')+'</button></div><p class="muted">'+(name==='Livre à l’envers'?'Inventez une histoire en regardant les images d’un livre.':name==='Yoga rigolo'?'Quelques postures simples pour souffler ensemble.':name==='Chasse aux couleurs'?'Trouvez des objets d’une couleur dans la maison.':'Écoutez les sons autour de vous, puis racontez ce que vous avez entendu.')+'</p><div class="meta"><span>'+icon('Clock')+'5 min</span><span>3–6 ans</span><span>Sans matériel</span></div><button class="'+(featured?'primary':'')+'" data-open="detail">Voir l’activité '+icon('ArrowRight')+'</button></article>'}
function tools(){const row='<div class="toolrow"><button data-open="filters">'+icon('SlidersHorizontal')+'Filtres'+(filter?' · 1':'')+'</button><button data-open="surprise">'+icon('Sparkle')+'Surprise</button></div>';return '<div class="tools"><label class="search">'+icon('MagnifyingGlass')+'<input aria-label="Rechercher une activité" placeholder="Rechercher une activité" value="'+esc(search)+'"></label>'+(variant==='c'?'<details '+(expanded?'open':'')+' id="moretools"><summary>Affiner ou me surprendre '+icon('CaretDown')+'</summary><div>'+row+'</div></details>':row)+'</div>'}
function activities(){const tabs='<div class="tabs" role="tablist" aria-label="Collections">'+[['discover','Découvrir','Sparkle'],['favorites','Favoris','Heart'],['recent','Récentes','Clock']].map(([v,l,i])=>'<button role="tab" aria-selected="'+(view===v)+'" data-view="'+v+'">'+icon(i)+l+'</button>').join('')+'</div>';let intro='<div class="intro"><h1>Une idée à partager</h1></div>'+tabs;let empty=state==='empty'||(view==='favorites'&&!fav);let feature=empty?'':card('Défi silence','🤫',true);let result='<div class="count"><span>'+(view==='favorites'?'Vos favoris':view==='recent'?'Consultées récemment':filter?'12 idées · 5 minutes':'98 idées')+'</span>'+(filter||search?'<button class="textbutton" data-reset>Effacer</button>':'')+'</div>';let cards=empty?'<div class="card empty"><h2>'+(view==='favorites'?'Aucun favori pour le moment':'Aucune idée ne correspond')+'</h2><p class="muted">'+(view==='favorites'?'Gardez une idée avec le cœur pour la retrouver ici.':'Essayez une recherche plus courte ou retirez un filtre.')+'</p><button data-reset>Revenir aux idées</button></div>':'<div class="grid">'+card('Livre à l’envers','📚')+card('Yoga rigolo','🧘')+card('Chasse aux couleurs','🌈')+'</div>';return intro+(view==='discover'?(variant==='b'?feature+tools()+result:tools()+result+feature):result+feature)+cards}
function routines(){return '<section class="weather"><span class="weatherIcon" aria-label="Éclaircies">🌤️</span><strong>Éclaircies · 23°</strong><span class="clothes" aria-label="Haut, bas, chaussures">👕 🩳 👟</span><button aria-label="Modifier la météo et les vêtements" data-open="outfit">'+icon('SlidersHorizontal')+'</button></section><div class="routinegrid"><article class="card"><p class="tag">Prochaine routine</p><div class="cardhead"><div class="emoji">☀️</div><div><h1>Super matin</h1><p class="muted">Emma · 8 étapes · 24 min</p></div></div><ol class="steps"><li>Se réveiller doucement</li><li>Prendre le petit-déjeuner</li><li>Se brosser les dents</li></ol><button class="primary" data-open="scope">'+icon('Play')+'Lancer</button></article><article class="card"><h2>Aujourd’hui</h2><p class="muted">Dimanche 20 septembre</p><button data-open="scope">'+icon('CalendarDots')+'Ouvrir le calendrier</button></article></div><h2>Vos autres routines</h2><article class="card"><h3>Le rituel du soir</h3><p class="muted">6 étapes · 20 min</p><button data-open="scope">Voir la routine</button></article>'}
function parent(){return '<div class="intro"><h1>Espace parent</h1><p class="muted">Préparez les routines et les repères.</p></div><div class="toolrow"><button class="primary" data-open="scope">Créer une routine</button><button data-page="routines">'+icon('Play')+'Lancer</button></div><div class="parenttools">'+[['Famille','Enfants et préférences','UsersThree'],['Routines','Créer et organiser','Check'],['Calendrier','Préparer les repères','CalendarDots'],['Progrès','Étoiles et récompenses','ChartLineUp'],['Réglages','Météo, sécurité et données','GearSix']].map(([t,d,i])=>'<button class="parentrow" data-open="scope">'+icon(i)+'<span class="grow"><strong>'+t+'</strong><small>'+d+'</small></span>'+icon('ArrowRight')+'</button>').join('')+'</div><details><summary>Idées et conseils '+icon('CaretDown')+'</summary><div><p class="muted">Célébrez chaque fin de routine par un sourire ou une phrase courte.</p></div></details>'}
function render(){app.className='app '+(dark?'dark ':'')+'variant-'+variant;document.querySelector('.theme').innerHTML=icon(dark?'Sun':'Moon');document.querySelector('.theme').setAttribute('aria-label',dark?'Passer au mode clair':'Passer au mode sombre');content.innerHTML=page==='activities'?activities():page==='routines'?routines():parent();document.getElementById('nav').innerHTML=[['routines','Routines','Check'],['activities','Activités','Sparkle'],['parent','Parent','GearSix']].map(([p,l,i])=>'<button data-page="'+p+'" '+(page===p?'aria-current="page" class="active"':'')+'>'+icon(i)+l+'<i></i></button>').join('');const input=content.querySelector('input');if(input)input.oninput=e=>{search=e.target.value};const more=document.getElementById('moretools');if(more)more.ontoggle=()=>{expanded=more.open}}
function open(kind){if(!document.querySelector('.dialog'))lastFocus=document.activeElement;document.querySelectorAll('.chrome,.pages,.bottom').forEach(e=>e.inert=true);let title='',body='';if(kind==='detail'){title='Défi silence';body='<div class="meta"><span>5 min</span><span>3–6 ans</span><span>Sans matériel</span></div><section class="card"><h3>Matériel</h3><p>Rien de spécial.</p></section><section class="card"><h3>Comment jouer</h3><ol class="steps"><li>Installez-vous ensemble.</li><li>Écoutez en silence pendant une minute.</li><li>Racontez chacun un son entendu.</li></ol></section><details><summary>Repères et variantes '+icon('CaretDown')+'</summary><div><p class="muted">Petit comité · 1–4 participants · Calme · Énergie faible · Rangement faible · Intérieur ou extérieur · Préparation 0 min · Adulte à proximité · Bruit faible · Sans écran.</p><p>Peu d’énergie : restez assis. Plus loin : cherchez d’où viennent les sons.</p><p>Compétences : attention et écoute.</p></div></details><button class="primary" data-open="scope">Activité terminée ensemble</button><button data-fav>Ajouter aux favoris</button>'}else if(kind==='filters'){title='Affiner les idées';body='<p class="muted">Les filtres existants sont conservés. Aperçu du regroupement proposé.</p>'+[['Le moment','Durée · préparation · saison · météo'],['Les participants','Âge · nombre · format · présence adulte'],['Le parent et le matériel','Énergie · humeur · matériel · bruit · rangement'],['Envies et découvertes','Types · compétences · objectifs · suggestions']].map(([t,d],i)=>'<details '+(!i?'open':'')+'><summary>'+t+icon('CaretDown')+'</summary><div><p class="muted">'+d+'</p>'+(!i?'<div class="chips"><button data-filter aria-pressed="'+filter+'">5 minutes</button><button data-open="scope">Autres durées</button></div>':'<p class="notice">Les valeurs actuelles restent disponibles dans ces rubriques. Leur sélection complète sera reliée à l’app après validation.</p>')+'</div></details>').join('')+'<button class="primary" data-apply>Voir les idées</button>'}else if(kind==='surprise'){title='Une surprise à partager';body='<p class="muted">Énergie, lieu et durée restent accessibles avant de tirer une idée.</p><div class="chips"><button aria-pressed="true">Peu d’énergie</button><button>À l’intérieur</button><button>5 minutes</button></div><button class="primary" data-open="detail">Découvrir une idée</button>'}else{title=kind==='outfit'?'Tenue — décision E17 ouverte':'Action conservée';body='<p>Ce prototype porte sur la hiérarchie visuelle. '+(kind==='outfit'?'Le panneau tenue existant et ses décisions sont conservés; aucun nouvel état E17 n’est validé ici.':'Le parcours métier sera conservé lors de l’intégration; aucune donnée n’est créée ni modifiée ici.')+'</p>'}document.getElementById('overlay').innerHTML='<div class="modal"><section class="dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="dialoghead"><h2>'+title+'</h2><button data-close aria-label="Fermer">'+icon('X')+'</button></div>'+body+'</section></div>';document.querySelector('[data-close]').focus()}
function close(){document.getElementById('overlay').innerHTML='';document.querySelectorAll('.chrome,.pages,.bottom').forEach(e=>e.inert=false);lastFocus?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();document.getElementById('pages').scrollTop=0}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.open)open(b.dataset.open);else if(b.hasAttribute('data-close'))close();else if(b.hasAttribute('data-fav')){fav=!fav;if(document.querySelector('.dialog')){b.textContent=fav?'Retirer des favoris':'Ajouter aux favoris'}else render()}else if(b.hasAttribute('data-filter')){filter=!filter;b.setAttribute('aria-pressed',filter)}else if(b.hasAttribute('data-apply')){close();render();content.querySelector('[data-open="filters"]')?.focus()}else if(b.hasAttribute('data-reset')){state='normal';search='';filter=false;view='discover';render()}else if(b.classList.contains('theme')){dark=!dark;render()}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.dialog');if(!dialog)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const focus=[...dialog.querySelectorAll('button,input,summary')].filter(e=>e.getClientRects().length);const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.getElementById('variant').onchange=e=>{variant=e.target.value;render()};document.getElementById('state').onchange=e=>{state=e.target.value;render()};render();if(q.get('overlay'))open(q.get('overlay'));
}
